# H0 CI gate (docs/phases/16_post_launch_roadmap.md). Runs the zero-network suites
# on every PR and push, so nothing reaches `main` (which Render auto-deploys) unchecked.
#
# This workflow NEVER deploys. A green run is not authorisation to push `main`:
# every push to `main` redeploys to real users and is the owner's call, every time.
#
# Zero network, zero quota: no GOOGLE_API_KEY secret is defined or referenced here.
# The Gemini-backed scripts (test_phase02.py, judge_phase06.py, transcript_chat.py,
# probe_embed_quota.py) are deliberately NOT run: the free tier is 20 calls/day/model
# and CI would burn it on every push.
#
# Install is the slim runtime `requirements.txt` only. Verified 2026-10-15 on a fresh
# clone + clean venv: all suites below pass with nothing added, so there is no
# requirements-ci.txt. Every input they read (data/processed/*, data/eval/*,
# data/ngo.csv, oov_bridge.json) is committed; nothing under runs/ or the GloVe file
# is needed. Suites excluded on purpose:
#   eval_heldout / eval_chat / ablate_* / calibrate_refusal -- measurement harnesses,
#     run by hand when retrieval changes; not pass/fail gates for every push.
#   build_oov_bridge / e4_reach -- need the gitignored GloVe file in runs/e4_vectors/.

name: offline-suites

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: offline-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Boot-import smoke (must not start a server)
        run: python -c "import app"

      - name: test_phase03 (NGO connector)
        run: python scripts/test_phase03.py

      - name: test_phase04 (intent router)
        run: python scripts/test_phase04.py

      - name: test_phase05 (UI script-level asserts)
        run: python scripts/test_phase05.py

      - name: test_phase09_ops (ops/chat invariants, zero network)
        run: python scripts/test_phase09_ops.py

      - name: audit_corpus (corpus shape gate + v1 tripwire)
        run: python scripts/audit_corpus.py

      - name: bench_phase01 (retrieval bench)
        run: python scripts/bench_phase01.py
